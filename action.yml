name: Rivet Deploy
description: Deploy mapped branches to Rivet v3 clusters and optional Fly.io previews
author: Rivet
branding:
  icon: server
  color: orange
inputs:
  branch-clusters:
    description: 'JSON map of exact branch names to cluster names or {cluster, region, pool} objects'
    default: '{}'
  rivet-token:
    description: 'Rivet Cloud credential with cluster deployment access (not an Engine admin token)'
  rivet-org:
    description: 'Organization slug for mapped Rivet Cloud clusters'
  rivet-cli-version:
    description: '@rivetkit/cli version or dist-tag with v3 --cluster support'
    default: latest
  rivet-cli-path:
    description: Optional preinstalled v3 CLI executable; overrides rivet-cli-version
  github-token:
    description: Token for PR status comments
    default: ${{ github.token }}
  docker-build-path:
    description: Docker build context, relative to the checkout
    default: '.'
  dockerfile-path:
    description: Dockerfile, relative to the checkout
    default: Dockerfile
  fly-enabled:
    description: Deploy unmapped branches to Fly.io
    default: 'false'
  fly-token:
    description: Fly.io token with permission to create and delete apps in fly-org
  fly-org:
    description: Fly.io organization slug
  fly-region:
    description: Fly preview region; keep unchanged while a preview exists
    default: iad
  fly-port:
    description: HTTP port served by the app in the container
    default: '8080'
  fly-memory:
    description: Memory in MiB for the single preview Machine
    default: '1024'
  fly-volume-size:
    description: Size in GiB of the local RivetKit data volume; existing volumes grow when increased
    default: '20'
outputs:
  status:
    description: ready, skipped, or closed
    value: ${{ steps.deploy.outputs.status }}
  provider:
    description: rivet or fly
    value: ${{ steps.deploy.outputs.provider }}
  url:
    description: Public app URL (not the Rivet Engine API)
    value: ${{ steps.deploy.outputs.url }}
  build-id:
    description: Rivet build ID for rollback
    value: ${{ steps.deploy.outputs.build-id }}
  fly-app:
    description: Fly preview app name
    value: ${{ steps.deploy.outputs.fly-app }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'
    - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      if: inputs.fly-enabled == 'true' || inputs.fly-token != ''
      with:
        version: '0.4.110'
    - name: Install action dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bun install --frozen-lockfile --cwd "$ACTION_PATH"
    - name: Deploy
      id: deploy
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BRANCH_CLUSTERS: ${{ inputs.branch-clusters }}
        RIVET_CLOUD_TOKEN: ${{ inputs.rivet-token }}
        RIVET_CLI_VERSION: ${{ inputs.rivet-cli-version }}
        RIVET_CLI_PATH: ${{ inputs.rivet-cli-path }}
        RIVET_ORG: ${{ inputs.rivet-org }}
        DOCKER_BUILD_PATH: ${{ inputs.docker-build-path }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        FLY_ENABLED: ${{ inputs.fly-enabled }}
        FLY_API_TOKEN: ${{ inputs.fly-token }}
        FLY_ORG: ${{ inputs.fly-org }}
        FLY_REGION: ${{ inputs.fly-region }}
        FLY_PORT: ${{ inputs.fly-port }}
        FLY_MEMORY: ${{ inputs.fly-memory }}
        FLY_VOLUME_SIZE: ${{ inputs.fly-volume-size }}
      run: bun run "$ACTION_PATH/src/index.ts"
    - name: Report failed deployment
      if: failure() && !cancelled()
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEPLOY_CANCELLED: 'false'
      run: bun run "$ACTION_PATH/src/report.ts"
    - name: Report cancelled deployment
      if: cancelled()
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEPLOY_CANCELLED: 'true'
      run: bun run "$ACTION_PATH/src/report.ts"
